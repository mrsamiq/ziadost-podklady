<!doctype html><html lang="sk" data-version="13. 10. 2026" data-polia="75f990f0"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow, noarchive"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: blob:; connect-src https://api.github.com; form-action 'none'; base-uri 'none'"><title>Žiadosť o podklady</title><style>
@page { size: A4; margin: 21mm 27mm 18mm 16mm; }
@page cover { margin: 0; }
* { box-sizing: border-box; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 9.6pt; line-height: 1.4; color: #1d2433; margin: 0; }
a { color: inherit; text-decoration: none; }
a.xr { color: #1F5FA0; border-bottom: 0.2mm dotted #1F5FA0; }
p { margin: 0 0 2.2mm 0; }
.pb { break-before: page; }
.mk { position: absolute; font-size: 2px; line-height: 2px; color: #FFFFFE; white-space: nowrap; font-family: Arial; }
.mks { left: 0; top: 0; }
.mke { right: 0; bottom: 0; }
.idf { font-family: Verdana, 'Segoe UI', sans-serif; letter-spacing: 0; }

/* Titulná strana */
.cover { page: cover; position: relative; height: 297mm; width: 210mm; overflow: hidden; }
.cover .band { background: #16243A; color: #fff; padding: 20mm 22mm 12mm 22mm; }
.cover .kicker { font-size: 10pt; letter-spacing: .08em; text-transform: uppercase; color: #9FB4D3; }
.cover h1 { font-size: 27pt; line-height: 1.12; margin: 4mm 0 3mm 0; font-weight: 700; }
.cover .sub { font-size: 13pt; color: #DCE6F4; }
.cover .meta { margin-top: 7mm; font-size: 10pt; color: #C9D6EA; }
.cover .meta b { color: #fff; font-weight: 600; }
.cover .body { padding: 8mm 22mm 0 22mm; }
.fill { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; margin-bottom: 6mm; }
.fill .f { border: 0.4mm solid #9AA6B8; border-left: 2.2mm solid #16243A; border-radius: 2.5mm; padding: 3mm 4mm; }
.fill .f .l { font-size: 8.5pt; color: #3A4558; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.fill .f .v { font-size: 12.5pt; font-weight: 700; min-height: 8mm; border-bottom: 0.3mm dotted #7A869A; margin-top: 2mm; position: relative; }
.steps { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5mm; margin-bottom: 6mm; }
.step { background: #F2F5FA; border-radius: 3mm; padding: 4mm 4.5mm; }
.step .n { display: inline-block; width: 8mm; height: 8mm; border-radius: 50%; background: #16243A; color: #fff; text-align: center; line-height: 8mm; font-weight: 700; margin-bottom: 2mm; }
.step .t { font-weight: 700; font-size: 10.5pt; margin-bottom: 1mm; }
.step .d { font-size: 9pt; color: #3A4558; }
.prio { border-left: 2.2mm solid #C0392B; background: #FBEDEB; border-radius: 0 3mm 3mm 0; padding: 4mm 5mm; margin-bottom: 6mm; }
.prio .t { font-weight: 700; font-size: 11pt; color: #8E2A20; margin-bottom: 1.5mm; }
.prio ul { margin: 0; padding-left: 5mm; }
.cover h2 { font-size: 12pt; margin: 0 0 3mm 0; }
.note { background: #F2F5FA; border-radius: 3mm; padding: 3.5mm 4.5mm; }
.note p:last-child { margin-bottom: 0; }
.small { font-size: 8.3pt; color: #4A5568; }

/* Prehľad častí */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 4mm; }
.tile { display: flex; border: 0.35mm solid #C9D2DE; border-radius: 3mm; overflow: hidden; break-inside: avoid; min-height: 27mm; }
.tile .let { width: 15mm; color: #fff; font-size: 20pt; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.tile .tx { padding: 2.6mm 3.5mm; flex: 1; }
.tile .nm { font-weight: 700; font-size: 10.3pt; line-height: 1.25; }
.tile .info { font-size: 8.6pt; color: #4A5568; margin-top: 1mm; }
.tile .pg { font-size: 8.6pt; font-weight: 700; margin-top: 1mm; }
.pill { display: inline-block; background: #C0392B; color: #fff; font-size: 7pt; font-weight: 700; letter-spacing: .06em; border-radius: 1.2mm; padding: 0.2mm 1.5mm; vertical-align: middle; margin-left: 1.5mm; }

h2.page-title { font-size: 17pt; margin: 0 0 4mm 0; color: #16243A; }
.boxh { font-weight: 700; font-size: 11pt; margin: 4.5mm 0 2mm 0; color: #16243A; }
ul.how { margin: 0; padding-left: 5mm; }
ul.how li { margin-bottom: 1.4mm; }
table.gloss { width: 100%; border-collapse: collapse; font-size: 9.1pt; }
table.gloss td { padding: 1.4mm 2mm; border-bottom: 0.25mm solid #E1E6EE; vertical-align: top; }
table.gloss td:first-child { width: 52mm; font-weight: 600; }

/* Hlavička časti */
.sec-head { display: flex; align-items: stretch; border-radius: 3.5mm; overflow: hidden; margin-bottom: 4mm; }
.sec-head .big { width: 24mm; color: #fff; font-size: 34pt; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.sec-head .tx { flex: 1; padding: 4mm 5mm; }
.sec-head .lbl { font-size: 8.5pt; text-transform: uppercase; letter-spacing: .12em; font-weight: 700; }
.sec-head h2 { font-size: 16pt; margin: 0.6mm 0 1.6mm 0; line-height: 1.2; color: #16243A; }
.sec-head .meta { font-size: 9pt; color: #3A4558; }
.who { display: flex; gap: 4mm; font-size: 8.4pt; color: #3A4558; margin: 0 0 4mm 0; align-items: flex-end; }
.who .w { display: flex; align-items: flex-end; gap: 1.5mm; white-space: nowrap; }
.who > span:first-child { white-space: nowrap; }
.lead { font-size: 9.4pt; margin-bottom: 4mm; padding: 3mm 4mm; border-radius: 2.5mm; }

/* Otázky */
.q { border: 0.35mm solid #C9D2DE; border-left-width: 1.8mm; border-radius: 2.5mm; padding: 2.4mm 3.6mm 2.8mm 3.6mm; margin-bottom: 3mm; break-inside: avoid; position: relative; }
.qh { display: flex; gap: 3mm; }
.qid { flex: 0 0 auto; min-width: 11mm; height: 6.8mm; border-radius: 1.6mm; color: #fff; font-weight: 700; text-align: center; line-height: 6.8mm; font-size: 9pt; padding: 0 1.3mm; }
.qt { flex: 1; font-size: 9.8pt; font-weight: 400; }
.na { flex: 0 0 auto; font-size: 8pt; color: #4A5568; padding-top: 0.6mm; }
.why { font-size: 8.2pt; color: #4A5568; margin: 1.2mm 0 1.4mm 14mm; }
.why b { font-weight: 600; color: #3A4558; }
.ans { margin-left: 14mm; border-radius: 1.6mm; background-color: #FAFBFD; border: 0.3mm solid #B9C3D2; position: relative; padding: 0 2.5mm; }
.ans .ln { height: 6.8mm; border-bottom: 0.3mm solid #A9B4C4; }
.ans .ln:last-of-type { border-bottom: none; }
.ans .al { position: absolute; top: 0.5mm; left: 3mm; font-size: 6.8pt; color: #7A869A; text-transform: uppercase; letter-spacing: .08em; }
.struct { margin-left: 14mm; border-radius: 1.6mm; background: #FAFBFD; border: 0.3mm solid #B9C3D2; padding: 1.6mm 3mm 2mm 3mm; }
.struct .sr { display: flex; align-items: flex-end; gap: 2mm; margin-top: 1.4mm; font-size: 8.8pt; }
.struct .sr .sl { flex: 0 0 auto; max-width: 78mm; color: #3A4558; }
.struct .sr .blank { flex: 1; }
.struct .grid { display: grid; gap: 0.4mm 3mm; margin-top: 1mm; }

/* Tabuľky */
table.t { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 9pt; }
table.t thead { display: table-header-group; }
table.t th { text-align: left; font-size: 8.3pt; color: #fff; padding: 1.8mm 2.2mm; font-weight: 700; line-height: 1.25; }
table.t td { padding: 2mm 2.2mm; border-bottom: 0.3mm solid #D3DAE4; vertical-align: top; }
table.t tr { break-inside: avoid; }
table.t tbody tr:nth-child(even) td { background: #FAFBFD; }
.tid { display: inline-block; min-width: 9.5mm; text-align: center; border-radius: 1.4mm; color: #fff; font-weight: 700; font-size: 8.4pt; padding: 0.6mm 1mm; }
.stav { display: grid; grid-template-columns: auto auto; gap: 1mm 2mm; }
.cbw { display: inline-flex; align-items: center; margin: 0 2.6mm 1mm 0; white-space: nowrap; font-size: 8.7pt; }
.cbw.block { display: flex; white-space: normal; align-items: flex-start; }
.cbw.block .cb { margin-top: 0.4mm; }
.cb { display: inline-block; width: 3.7mm; height: 3.7mm; border: 0.35mm solid #4A5568; border-radius: 0.6mm; margin-right: 1.5mm; background: #fff; flex: 0 0 auto; position: relative; }
.blank { display: inline-block; height: 5.2mm; border-bottom: 0.3mm solid #8A96A8; position: relative; vertical-align: bottom; }

/* Karty (služby, prehľad) */
.card { border: 0.35mm solid #C9D2DE; border-radius: 2.5mm; margin-bottom: 3mm; break-inside: avoid; overflow: hidden; position: relative; }
.card .ch { padding: 2mm 3.6mm; font-weight: 700; font-size: 9.8pt; display: flex; align-items: center; gap: 2mm; }
.card .ch b { font-weight: inherit; }
.card .ch .num { flex: 0 0 auto; min-width: 9mm; color: #fff; border-radius: 1.4mm; text-align: center; font-size: 8.4pt; padding: 0.3mm 1mm; }
.card .ch .tt { flex: 1; }
.card .ch .na { font-weight: 400; }
.card .row { display: flex; padding: 1.2mm 3.6mm 0.8mm 3.6mm; align-items: flex-end; }
.card .row .lab { flex: 0 0 44mm; font-size: 8.5pt; color: #3A4558; padding-right: 3mm; }
.card .row.wide .lab { flex-basis: 62mm; }
.card .row .val { flex: 1; min-height: 6.2mm; border-bottom: 0.3mm solid #8A96A8; font-size: 9pt; position: relative; }
.card .row .val.pre { font-weight: 600; }
.card .row .val.multi { border-bottom: none; display: flex; flex-direction: column; }
.card .row .val.multi .blank { width: 100%; height: 6.2mm; }
.card .row .val.cbs { border-bottom: none; padding-top: 1mm; }

.end h2 { font-size: 17pt; color: #16243A; margin: 0 0 4mm 0; }
.nw { white-space: nowrap; }
.sec-head h2, .tile .nm { text-wrap: balance; }
.card .row.m { align-items: flex-start; padding-top: 2mm; }
.card .row.m .lab { padding-top: 1.6mm; }
.card .row.m .val.multi .blank { height: 5.6mm; }
.iny { display: flex; align-items: flex-end; gap: 1.5mm; }
.iny .blank { flex: 1; }
.end ul { padding-left: 5mm; }
.end li { margin-bottom: 1.2mm; }
.contact { margin-top: 5mm; border: 0.4mm solid #9AA6B8; border-left: 2.2mm solid #16243A; border-radius: 3mm; padding: 3.5mm 5mm; break-inside: avoid; }
.contact .l { font-size: 8.5pt; color: #3A4558; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.contact .v { font-size: 11pt; font-weight: 600; min-height: 8mm; border-bottom: 0.3mm dotted #7A869A; margin-top: 2mm; position: relative; }
/* Webová vrstva nad tlačovým CSS z pdf_build/build.py (B.CSS) – rovnaký vzhľad ako PDF + ovládanie. */
:root { --navy: #16243A; --bar: 46px; }
html { background: #DCE2EB; scroll-behavior: smooth; scroll-padding-top: calc(var(--bar) + 12px); }
body { padding-top: var(--bar); }
#app[hidden] { display: none; }
.todo { color: #C0392B; font-weight: 700; }

@media screen {
  html, body { overflow-x: clip; }
  .sheet { width: 210mm; margin: 6mm auto 8mm; background: #fff; padding: 21mm 27mm 18mm 16mm; position: relative;
           box-shadow: 0 1px 3px rgba(22,36,58,.10), 0 8px 24px rgba(22,36,58,.10); border-radius: 1.5mm; }
  .sheet.cover-sheet { padding: 0; overflow: hidden; }
  .cover { width: auto; height: auto; min-height: 297mm; }
  .end h2 { margin-top: 0; }
  .pv { display: none; }
}

/* horná lišta */
#topbar { position: fixed; top: 0; left: 0; right: 0; height: var(--bar); background: var(--navy); color: #fff; z-index: 60;
          display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
#topbar .ttl { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; min-width: 0; flex: 0 1 auto; }
#topbar .cur { padding: 3px 9px; border-radius: 5px; font-weight: 700; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 38vw; }
#topbar .cur:empty { display: none; }
#topbar .sp { flex: 1; }
#saved { font-size: 11.5px; color: #B9C7DD; white-space: nowrap; }
.sync { flex: 0 0 auto; width: 11px; height: 11px; border-radius: 50%; background: #8FA0B8; box-shadow: 0 0 0 2px rgba(255,255,255,.18); }
.sync.ok { background: #35C27D; }
.sync.saving { background: #F2B53A; }
.sync.error { background: #FF5A43; }
.sync.local { background: #8FA0B8; }
#saved.warn { color: #FFB4A8; font-weight: 700; }
button { font: inherit; cursor: pointer; }
#topbar button, button.inl { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.28); border-radius: 6px; padding: 6px 10px; white-space: nowrap; }
#topbar button:hover { background: rgba(255,255,255,.22); }
#topbar button.primary, button.inl.primary { background: #2E9E68; border-color: #2E9E68; font-weight: 700; color: #fff; }
button.inl { background: #16243A; border-color: #16243A; font-size: 9pt; padding: 1.2mm 2.6mm; margin: 0 0.6mm; }

/* záložky na pravom okraji (ako v PDF) */
#tabs { position: fixed; top: calc(var(--bar) + 24px); bottom: 18px; left: calc(50% + 105mm - 16mm); width: 16mm; z-index: 50;
        display: flex; flex-direction: column; gap: 1.4mm; align-items: flex-end; }
#tabs .tab { position: relative; display: flex; align-items: center; justify-content: center; width: 12mm; flex: 1 1 0; max-height: 22mm;
             background: var(--t); color: var(--d); font-weight: 700; font-size: 10.5pt; border-radius: 2mm 0 0 2mm; text-decoration: none; transition: width .15s; }
#tabs .tab.ov { flex: 0 0 10mm; width: 11mm; background: #DCE0EA; color: var(--navy); font-size: 13pt; margin-bottom: 2mm; }
#tabs .tab:hover { width: 14mm; }
#tabs .tab.active { width: 16mm; background: var(--c); color: #fff; font-size: 13pt; }
#tabs .tab.ov.active { background: var(--navy); color: #fff; }
#tabs .tab .dot { position: absolute; left: 1.4mm; top: 1.4mm; width: 2.2mm; height: 2.2mm; border-radius: 50%; background: #C0392B; }
#tabs .tab.active .dot { background: #fff; }

/* vstupy: linky (rastúce textarea) a rámčeky */
.blank { height: auto; min-height: 5.2mm; }
.card .row .val.multi .blank { height: auto; min-height: 6.2mm; }
.card .row.m .val.multi .blank { height: auto; min-height: 5.6mm; }
.w-line { display: block; width: 100%; height: 5mm; min-height: 5mm; border: 0; background: transparent; resize: none; overflow: hidden;
          padding: 0.7mm 1mm 0.2mm; margin: 0; font: 9.4pt/1.3 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; color: #0D2050;
          outline: none; border-radius: 1mm 1mm 0 0; }
.card .row .val > .w-line { min-height: 6mm; padding-top: 1.3mm; }
.who .w-line { font-size: 8.6pt; padding-left: 0.3mm; padding-right: 0.3mm; }
.w-line:hover { background: rgba(31,95,160,.05); }
.w-line:focus { background: #EAF1FD; }
.ans { height: auto; }
.w-box { display: block; width: 100%; min-height: var(--h, 20mm); border: 0; background: transparent; resize: vertical; outline: none;
         font: 10pt/1.45 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; color: #0D2050; padding: 5mm 0.5mm 2mm; overflow: hidden; }
.ans:focus-within { border-color: #5B8DEF; box-shadow: 0 0 0 2px rgba(91,141,239,.18); }
label.cbw { cursor: pointer; position: relative; user-select: none; }
label.cbw input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
label.cbw .cb { transition: background .1s; }
label.cbw:hover .cb { border-color: #1F5FA0; }
label.cbw input:checked + .cb { background: var(--navy); border-color: var(--navy); }
label.cbw input:checked + .cb::after { content: ''; position: absolute; left: 1.05mm; top: 0.2mm; width: 0.95mm; height: 2.1mm;
        border: solid #fff; border-width: 0 0.55mm 0.55mm 0; transform: rotate(45deg); }
label.cbw input:focus-visible + .cb { outline: 2px solid #5B8DEF; outline-offset: 1px; }
.na-on .ans, .na-on .struct, .na-on .row, tr.na-on td + td { opacity: .38; }
.prog { font-weight: 700; }
.prog.done { color: #2E9E68; }
.send ol { margin: 2mm 0 0 0; padding-left: 5mm; font-size: 9.6pt; }
.send ol li { margin-bottom: 1.8mm; }

/* hlásenia */
#toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); background: var(--navy); color: #fff; max-width: calc(100vw - 32px);
         padding: 10px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: all .2s; z-index: 70; pointer-events: none; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.warn { background: #A93226; }
#apperr { display: none; position: fixed; left: 16px; right: 16px; top: calc(var(--bar) + 12px); z-index: 80; background: #A93226; color: #fff;
          padding: 12px 16px; border-radius: 8px; font-size: 14px; }

/* prihlásenie */
#lock { position: fixed; inset: 0; background: #DCE2EB; display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
#lock .lockcard { width: min(560px, 100%); background: #fff; border-radius: 3mm; overflow: hidden; box-shadow: 0 8px 30px rgba(22,36,58,.18); }
#lock .band { background: var(--navy); color: #fff; padding: 26px 30px 22px; }
#lock .kicker { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #9FB4D3; }
#lock h1 { font-size: 28px; margin: 8px 0 4px; }
#lock form { padding: 22px 30px 8px; }
#lock label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #3A4558; }
#lock input { width: 100%; font-size: 16px; padding: 10px 12px; border: 1px solid #9AA6B8; border-radius: 6px; }
#lock button { margin-top: 12px; width: 100%; padding: 11px; font-size: 15px; font-weight: 700; color: #fff; background: #2E9E68; border: 0; border-radius: 6px; }
#lock #lockerr { color: #C0392B; font-size: 13px; min-height: 18px; margin-top: 8px; }
#lock .small { padding: 0 30px 24px; }
body.locked #topbar, body.locked #tabs { display: none; }

/* menšie obrazovky */
@media screen and (max-width: 860px) {
  .sheet { width: auto; margin: 3mm 11mm 5mm 2mm; padding: 6mm 5mm 6mm 5mm; }
  .sheet.cover-sheet .body { padding: 6mm 5mm 0; }
  .cover .band { padding: 10mm 6mm 8mm; }
  .cover { min-height: 0; }
  #tabs { left: auto; right: 0; width: 9mm; }
  #tabs .tab { width: 8mm; font-size: 9pt; }
  #tabs .tab.active { width: 9mm; font-size: 10pt; }
  #tabs .tab.ov { width: 8mm; }
  .tiles, .fill, .steps { grid-template-columns: 1fr; }
  .qh { flex-wrap: wrap; }
  .why, .ans, .struct { margin-left: 0; }
  #saved, #topbar .bl { display: none; }
  #topbar { gap: 5px; padding: 0 8px; }
  #topbar button { padding: 6px 9px; }
  #topbar .cur { min-width: 0; flex: 0 1 auto; }
  .card .row { flex-wrap: wrap; }
  .card .row .lab { flex-basis: 100% !important; }
  .card .row .val { flex-basis: 100%; }
  table.t { display: block; overflow-x: auto; }
  .struct .grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  .struct .cbw { white-space: normal; }
  .who { flex-wrap: wrap; }
}
@media screen and (max-width: 520px) {
  /* horná lišta: namiesto názvu dokumentu aktuálna časť */
  #topbar:has(.cur:not(:empty)) .ttl { display: none; }
  #topbar .cur { flex: 1 1 auto; max-width: none; }
  .cover .band h1 { font-size: 24pt; }
  /* otázka: číslo a „netýka sa nás“ hore, text pod nimi */
  .qh .qid { order: 1; }
  .qh .na { order: 2; margin-left: auto; padding-top: 0.6mm; }
  .qh .qt { order: 3; flex: 1 1 100%; margin-top: 1.2mm; }
  .card .ch { flex-wrap: wrap; }
  .card .ch .num { order: 1; }
  .card .ch .na { order: 2; margin-left: auto; }
  .card .ch .tt { order: 3; flex: 1 1 100%; }
  .struct .grid { grid-template-columns: minmax(0, 1fr) !important; }
  .struct .sr { flex-wrap: wrap; }
  .struct .sr .sl { flex: 1 1 100%; min-width: 0; max-width: none; white-space: normal; overflow-wrap: anywhere; }
  .struct .sr .blank { flex: 1 1 100%; }
  /* tabuľky A a F pod seba */
  table.t { display: block; overflow: visible; }
  table.t thead { display: none; }
  table.t tbody { display: block; }
  table.t tr { display: grid; grid-template-columns: 12mm minmax(0, 1fr); border-bottom: 0.3mm solid #D3DAE4; }
  table.t td { display: block; border-bottom: 0; min-width: 0; }
  table.t-dokumenty td:nth-child(3) { grid-column: 2; padding-top: 0; }
  table.t-dokumenty .stav { grid-template-columns: 1fr 1fr; }
  table.t-dodavatelia tr { grid-template-columns: minmax(0, 1fr); }

    return mergeIncoming(st, false);
  }

  // ---------------------------------------------------------------- server (GitHub, súkromný repozitár)
  var CFG = null;   // {api, repo, path, token, pollMs} – je len v zašifrovanom obsahu
  var srv = { sha: null, etag: null, U: {}, inflight: {}, pushing: false, again: false, timer: null, first: 0,
              loaded: false, fails: 0, conflicts: 0, blocked: false, denied: false, warned: false, lastOk: null };
  function apiUrl() {
    return CFG.api.replace(/\/$/, '') + '/repos/' + CFG.repo + '/contents/' + CFG.path.split('/').map(encodeURIComponent).join('/');
  }
  function gh(method, body, extra) {
    var h = { 'Authorization': 'Bearer ' + CFG.token, 'Accept': 'application/vnd.github+json' };
    if (extra) keys(extra).forEach(function (k) { h[k] = extra[k]; });
    var opt = { method: method, headers: h, cache: 'no-store' };
    if (body) { h['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
    return fetch(apiUrl(), opt);
  }
  function restoreU(snap) { keys(snap).forEach(function (k) { srv.U[k] = 1; }); }
  async function pullServer() {
    if (!CFG || srv.blocked) return 0;
    var res = await gh('GET', null, srv.etag ? { 'If-None-Match': srv.etag } : null);
    if (res.status === 304) { srv.loaded = true; return 0; }
    if (res.status === 404) { srv.sha = null; srv.etag = null; srv.loaded = true; return 0; }
    if (res.status === 401 || res.status === 403) srv.denied = true;
    if (!res.ok) throw new Error('http ' + res.status);
    var j = await res.json(), st;
    try { st = await decryptStored(JSON.parse(atob(String(j.content || '').replace(/\s/g, '')))); }
    catch (e) { srv.blocked = true; throw new Error('decrypt'); }
    srv.sha = j.sha; srv.etag = res.headers.get('ETag'); srv.loaded = true; srv.denied = false;
    var n = mergeIncoming(st, true);
    if (n) save();
    return n;
  }
  function schedulePush(ms) { clearTimeout(srv.timer); srv.timer = setTimeout(pushServer, ms); }
  function changed() {
    if (!CFG) return;
    var now = Date.now();
    if (!srv.first) srv.first = now;
    if (!srv.fails) schedulePush(Math.max(0, Math.min(3000, srv.first + 15000 - now)));  // 3 s po poslednej zmene, najneskôr po 15 s
    setSync();
  }
  function failed(e, snap) {
    if (snap) restoreU(snap);
    srv.inflight = {}; srv.pushing = false; srv.conflicts = 0; srv.fails++;
    setSync();
    if (!srv.warned) {
      srv.warned = true;
      toast(srv.denied || srv.blocked
        ? 'Odpovede sa nedajú uložiť na server – kontaktujte odosielateľa. Zatiaľ sú uložené v tomto prehliadači.'
        : 'Odpovede sa teraz nedajú uložiť na server (spojenie?). Zatiaľ sú uložené v tomto prehliadači, skúšam to znova.', 'warn');
    }
    if (!srv.blocked) schedulePush(Math.min(120000, 10000 * Math.pow(2, Math.min(srv.fails - 1, 4))));
    save();
  }
  async function pushServer() {
    clearTimeout(srv.timer); srv.timer = null;
    if (!CFG || srv.blocked) return;
    if (srv.pushing) { srv.again = true; return; }
    if (!keys(srv.U).length) { srv.first = 0; setSync(); return; }
    if (!srv.loaded) { try { await pullServer(); } catch (e) { return failed(e); } }
    srv.pushing = true; srv.first = 0;
    var snap = srv.U; srv.U = {}; srv.inflight = snap;
    setSync();
    var st = state(), res;
    delete st.nesync;  // len pre lokálnu zálohu
    try {
      var body = { message: 'Uloženie odpovedí', content: btoa(await seal(st)) };
      if (srv.sha) body.sha = srv.sha;
      res = await gh('PUT', body);
    } catch (e) { return failed(e, snap); }
    if (res.status === 200 || res.status === 201) {
      var j = null; try { j = await res.json(); } catch (e) {}
      srv.sha = j && j.content ? j.content.sha : null; srv.etag = null;
      srv.inflight = {}; srv.pushing = false; srv.fails = 0; srv.conflicts = 0; srv.warned = false; srv.denied = false;
      srv.lastOk = st.t;
      save(); setSync();
      if (srv.again || keys(srv.U).length) { srv.again = false; schedulePush(1500); }
      return;
    }
    if ((res.status === 409 || res.status === 422) && srv.conflicts++ < 5) {   // medzitým uložil niekto iný
      restoreU(snap); srv.inflight = {}; srv.pushing = false;
      try { await pullServer(); } catch (e) { return failed(e); }
      return pushServer();
    }
    if (res.status === 401 || res.status === 403) srv.denied = true;
    return failed(new Error('http ' + res.status), snap);
  }
  function setSync() {
    var dot = $('#sync'), s = $('#saved'), cls, txt;
    if (!CFG) { cls = 'local'; txt = store.lastT ? 'Uložené v tomto prehliadači · ' + fmtTime(store.lastT) : 'Ukladá sa v tomto prehliadači'; }
    else if (srv.blocked || srv.denied) { cls = 'error'; txt = 'Ukladanie na server nefunguje – kontaktujte odosielateľa (odpovede sú zatiaľ v tomto prehliadači)'; }
    else if (srv.fails) { cls = 'error'; txt = 'Neuložené na server – skúšam znova (odpovede sú zatiaľ v tomto prehliadači)'; }
    else if (srv.pushing || keys(srv.U).length || !srv.loaded) { cls = 'saving'; txt = srv.loaded ? 'Ukladám…' : 'Načítavam…'; }
    else { cls = 'ok'; txt = 'Všetko uložené' + (srv.lastOk ? ' · ' + fmtTime(srv.lastOk) : ''); }
    if (dot) { dot.className = 'sync ' + cls; dot.title = txt; }
    if (s) { s.textContent = txt; s.classList.toggle('warn', cls === 'error'); }
  }

  // ---------------------------------------------------------------- odomknutie
  async function unlock(pass) {
    var btn = $('#lockform button'), err = $('#lockerr'), html;
    if (btn) { btn.disabled = true; btn.textContent = 'Otváram…'; }
    try {
      html = await decryptPage(pass);
    } catch (e) {
      if (err) err.textContent = 'Nesprávne heslo. Skúste to znova.';
      if (btn) { btn.disabled = false; btn.textContent = 'Otvoriť'; }
      var pw = $('#pw'); if (pw) { pw.select(); pw.focus(); }
      return;
    }
    try {
      var app = $('#app');
      app.innerHTML = html;
      var c = document.getElementById('cfg');
      if (c) { try { CFG = JSON.parse(c.textContent); } catch (e) { CFG = null; } c.remove(); }
      var opened = await openStore(pass);
      var lock = $('#lock'); if (lock) lock.remove();
      document.body.classList.remove('locked');
      app.hidden = false;
      init(opened);
      if (location.hash) { var t = document.getElementById(location.hash.slice(1)); if (t) requestAnimationFrame(function () { t.scrollIntoView({ behavior: 'auto' }); }); }
    } catch (e) {
      if (window.console) console.error(e);
      var box = $('#apperr');
      if (box) { box.textContent = 'Pri otváraní žiadosti nastala chyba. Skúste stránku obnoviť alebo použiť iný prehliadač; ak to nepomôže, kontaktujte odosielateľa.'; box.style.display = 'block'; }
    }
  }

  // ---------------------------------------------------------------- aplikácia
  var saveTimer = null, FIELDS = [], BYNAME = {};
  var writing = false, again = false, conflicts = 0;
  function isChk(el) { return el.type === 'checkbox' || el.type === 'radio'; }
  function group(el) { return el.type === 'radio' && el.name ? $$('input[type=radio][name="' + esc(el.name) + '"]') : [el]; }
  function markDirty(el) { group(el).forEach(function (o) { store.dirty[o.dataset.f] = 1; srv.U[o.dataset.f] = 1; }); }
  function syncRadios() { FIELDS.forEach(function (el) { if (el.type === 'radio') el.dataset.was = el.checked ? '1' : '0'; }); }
  function collect() { var o = {}; FIELDS.forEach(function (el) { o[el.dataset.f] = isChk(el) ? el.checked : el.value; }); return o; }
  function setVal(el, v) {
    if (isChk(el)) { var b = v === true || v === 'true' || v === 1; if (el.checked === b) return false; el.checked = b; return true; }
    var s = v == null ? '' : String(v); if (el.value === s) return false; el.value = s; return true;
  }
  // zlúči stav z inej karty (fromServer=false) alebo zo servera (true); polia zmenené tu a ešte neuložené sa nemenia
  function mergeIncoming(st, fromServer) {
    var v = isObj(st && st.v) ? st.v : {}, n = 0;
    keys(v).forEach(function (k) {
      if (store.dirty[k] || store.inflight[k]) return;
      if (fromServer && (srv.U[k] || srv.inflight[k])) return;
      var el = BYNAME[k];
      if (!el) { store.orphans[k] = v[k]; return; }
      if (setVal(el, v[k])) n++;
    });
    if (!fromServer) {
      if (Array.isArray(st.nesync)) st.nesync.forEach(function (k) { if (typeof k === 'string') srv.U[k] = 1; });
      if (st.t) store.lastT = st.t;
    }
    if (n) { syncRadios(); flags(); growAll(); progress(); }
    setSync();
    return n;
  }
  function filled(el) { return isChk(el) ? el.checked : !!(el.value && el.value.trim() && el.value !== (el.dataset.def || '')); }
  function toast(msg, kind) {
    var t = $('#toast'); if (!t) return;
    t.textContent = msg; t.classList.toggle('warn', kind === 'warn'); t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('show'); }, kind ? 8000 : 3000);
  }
  function growAll() {
    var tas = $$('textarea');
    tas.forEach(function (ta) { ta.style.height = 'auto'; });
    var hs = tas.map(function (ta) { return ta.scrollHeight; });
    tas.forEach(function (ta, i) { ta.style.height = hs[i] + 'px'; });
  }
  function grow(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }
  function flags() {
    FIELDS.forEach(function (el) {
      if (!FLAG_RE.test(el.dataset.f)) return;
      var item = el.closest('[id^="q-"]'); if (item) item.classList.toggle('na-on', el.checked);
    });
  }
  function progress() {
    var per = {};
    $$('.sheet[data-sec]').forEach(function (sh) {
      var s = sh.dataset.sec; if (!s) return;
      var items = $$('[id^="q-"]', sh), done = 0;
      items.forEach(function (it) { if ($$('[data-f]', it).some(filled)) done++; });
      per[s] = [done, items.length];
    });
    $$('[data-prog]').forEach(function (el) {
      var p = per[el.dataset.prog]; if (!p) return;
      el.textContent = (el.closest('.tile') ? 'Vyplnené ' : 'vyplnené ') + p[0] + ' z ' + p[1];
      el.classList.toggle('done', p[0] === p[1] && p[1] > 0);
    });
    $$('#tabs .tab[data-sec]').forEach(function (t) { var p = per[t.dataset.sec]; if (p) t.title = t.title.split(' – vyplnené')[0] + ' – vyplnené ' + p[0] + ' z ' + p[1]; });
  }
  function fmtTime(iso) {
    var d = iso ? new Date(iso) : new Date();
    if (isNaN(d)) d = new Date();
    var now = new Date(), same = d.toDateString() === now.toDateString();
    return (same ? '' : d.getDate() + '. ' + (d.getMonth() + 1) + '. ') + d.toLocaleTimeString('sk-SK', { hour: '2-digit', minute: '2-digit' });
  }
  function state() {
    var v = collect();
    keys(store.orphans).forEach(function (k) { if (!(k in v)) v[k] = store.orphans[k]; });
    var pend = {};
    keys(srv.U).concat(keys(srv.inflight)).forEach(function (k) { pend[k] = 1; });
    return { v: v, t: new Date().toISOString(), verzia: VERSION, polia: FIELDSET, nesync: keys(pend) };
  }
  // lokálna záloha (debounce 250 ms)
  function saveNow() {
    clearTimeout(saveTimer); saveTimer = null;
    if (writing) { again = true; return; }
    writing = true;
    var snap = store.dirty, gen = store.gen;
    store.dirty = {}; store.inflight = snap;
    var st = state();
    writeStore(st, gen).then(function (res) {
      writing = false; store.inflight = {};
      if (res === 'conflict' && ++conflicts <= 5) {
        keys(snap).forEach(function (k) { store.dirty[k] = 1; });
        syncFromStorage().then(saveNow, saveNow);
        return;
      }
      if (res === 'conflict') throw new Error('conflict');
      conflicts = 0; store.ok = true; store.lastT = st.t;
      if (!CFG) setSync();
      if (again) { again = false; saveNow(); }
    }).catch(function () {
      writing = false; store.inflight = {}; again = false; conflicts = 0;
      keys(snap).forEach(function (k) { store.dirty[k] = 1; });
      var first = store.ok; store.ok = false;
      if (first && !CFG) toast('Odpovede sa v tomto prehliadači nedajú uložiť.', 'warn');
    });
    progress();
  }
  function save() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 250); }
  function onEdit(el) { markDirty(el); save(); changed(); }

  function current() {
    var bar = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--bar'), 10) || 46;
    var secs = $$('.sheet[data-sec]'), y = bar + Math.min(160, innerHeight * 0.25), cur = null;
    for (var i = 0; i < secs.length; i++) { if (secs[i].getBoundingClientRect().top <= y + 2) cur = secs[i]; else break; }
    var sec = cur ? cur.dataset.sec : '';
    $$('#tabs .tab[data-sec]').forEach(function (t) { t.classList.toggle('active', t.dataset.sec === sec); });
    var ov = $('#tabs .tab.ov'); if (ov) ov.classList.toggle('active', !!cur && cur.querySelector('#prehlad') !== null);
    var c = $('#cur');
    if (c) {
      var tab = sec ? $('#tabs .tab[data-sec="' + sec + '"]') : null;
      c.textContent = tab ? tab.title.split(' – vyplnené')[0] : '';
      c.style.background = tab ? getComputedStyle(tab).getPropertyValue('--c') : '';
    }
  }
  // tlač: textové polia sa nahradia bežným textom (zalamuje sa a delí cez strany)
  function beforePrint() {
    afterPrint();
    growAll();
    $$('textarea').forEach(function (ta) {
      if (!ta.value) return;
      var pv = document.createElement('div');
      pv.className = 'pv'; pv.textContent = ta.value;
      ta.classList.add('has-pv'); ta.insertAdjacentElement('afterend', pv);
      if (ta.value.length > 700) { var q = ta.closest('.q, .card, tr'); if (q) q.classList.add('pv-long'); }
    });
  }
  function afterPrint() {
    $$('.pv').forEach(function (x) { x.remove(); });
    $$('.has-pv').forEach(function (x) { x.classList.remove('has-pv'); });
    $$('.pv-long').forEach(function (x) { x.classList.remove('pv-long'); });
  }
  function init(opened) {
    FIELDS = $$('[data-f]'); BYNAME = {};
    FIELDS.forEach(function (el) { BYNAME[el.dataset.f] = el; if (el.dataset.def) el.value = el.dataset.def; });
    var st = opened.st;
    keys(st.v).forEach(function (k) { if (!BYNAME[k]) store.orphans[k] = st.v[k]; });
    keys(st.v).forEach(function (k) { if (BYNAME[k]) setVal(BYNAME[k], st.v[k]); });
    syncRadios();
    if (Array.isArray(st.nesync)) st.nesync.forEach(function (k) { if (typeof k === 'string') srv.U[k] = 1; });
    store.lastT = st.t || null;
    FIELDS.forEach(function (el) {
      el.addEventListener(isChk(el) ? 'change' : 'input', function () {
        if (el.tagName === 'TEXTAREA') grow(el);
        if (el.type === 'radio') group(el).forEach(function (o) { o.dataset.was = o.checked ? '1' : '0'; });
        if (FLAG_RE.test(el.dataset.f)) flags();
        onEdit(el);
      });
      if (el.type === 'radio') {
        el.addEventListener('click', function () {
          if (el.dataset.was === '1') { el.checked = false; el.dataset.was = '0'; onEdit(el); }
        });
        el.addEventListener('keydown', function (ev) {
          if ((ev.key === ' ' || ev.key === 'Spacebar') && el.checked) { ev.preventDefault(); el.checked = false; el.dataset.was = '0'; onEdit(el); }
        });
      }
      if (el.classList.contains('w-line')) el.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') ev.preventDefault(); });
    });
    $$('[data-act="print"]').forEach(function (b) { b.addEventListener('click', function () { window.print(); }); });
    window.addEventListener('storage', function (ev) {
      if (ev.key !== null && ev.key !== KEY) return;
      syncFromStorage().then(function () {
        if (keys(store.dirty).length || store.raw === null) save();
        if (CFG && keys(srv.U).length && !srv.timer && !srv.pushing) changed();
      }, function () {});
    });
    window.addEventListener('beforeprint', beforePrint);
    window.addEventListener('afterprint', afterPrint);
    window.addEventListener('scroll', function () { if (!window._cq) { window._cq = true; requestAnimationFrame(function () { window._cq = false; current(); }); } }, { passive: true });
    window.addEventListener('resize', function () { clearTimeout(window._rz); window._rz = setTimeout(function () { growAll(); current(); }, 150); });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') { if (saveTimer) saveNow(); if (CFG && keys(srv.U).length) pushServer(); }
      else if (CFG && !srv.pushing) pullServer().then(notify, function () {});
    });
    window.addEventListener('pagehide', function () { if (saveTimer) saveNow(); if (CFG && keys(srv.U).length) pushServer(); });
    window.addEventListener('beforeunload', function (ev) {
      if (CFG && (keys(srv.U).length || srv.pushing)) { ev.preventDefault(); ev.returnValue = ''; }
    });
    window.addEventListener('online', function () { if (CFG) { srv.fails = 0; pushServer(); } });
    flags(); growAll(); progress(); current(); setSync();
    if (opened.problem === 'heslo') toast('Skoršie odpovede uložené v tomto prehliadači sa nepodarilo otvoriť. Ostali odložené – kontaktujte odosielateľa.', 'warn');
    if (CFG) {
      pullServer().then(function () {
        if (keys(srv.U).length) pushServer(); else setSync();
      }, function (e) { failed(e); });
      setInterval(function () {
        if (document.visibilityState === 'visible' && !srv.pushing && !srv.blocked) pullServer().then(notify, function () {});
      }, CFG.pollMs || 45000);
    }
  }
  function notify(n) { if (n) toast('Doplnené odpovede, ktoré medzitým uložili kolegovia.'); }

  // ---------------------------------------------------------------- štart
  document.addEventListener('DOMContentLoaded', function () {
    if (PLAIN) { unlock(''); return; }
    var form = $('#lockform');
    form.addEventListener('submit', function (ev) { ev.preventDefault(); unlock($('#pw').value); });
    setTimeout(function () { var p = $('#pw'); if (p) p.focus(); }, 50);
  });
})();
</script></body></html>
